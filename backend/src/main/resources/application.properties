# ==========================================================
# ACCET ProjectHub - Spring Boot configuration
# ==========================================================

spring.application.name=projecthub

# ---------- Server ----------
server.port=8080

# ---------- MySQL datasource ----------
# createDatabaseIfNotExist=true lets Spring Boot create the schema on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/projecthub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Jaz@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Base64-encoded 256-bit secret. CHANGE THIS IN PRODUCTION.
app.jwt.secret=bXlTdXBlclNlY3JldEtleUZvckFjY2V0UHJvamVjdEh1YjIwMjZTcHJpbmdCb290Sldt
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ---------- Seed demo data on first startup ----------
app.seed.enabled=true

# ---------- Error response detail ----------
server.error.include-message=always
server.error.include-binding-errors=always
