# ==========================================================
# ACCET ProjectHub - Spring Boot configuration
# ==========================================================

spring.application.name=projecthub

# Loads local SMTP settings when present; OS environment variables override this file.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# ---------- Server ----------
server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=160MB

# ---------- MySQL datasource ----------
# createDatabaseIfNotExist=true lets Spring Boot create the schema on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/projecthub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Jaz@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- SMTP (set credentials with environment variables) ----------
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.password-reset.cookie-secure=${PASSWORD_RESET_COOKIE_SECURE:false}
app.password-reset.cookie-same-site=${PASSWORD_RESET_COOKIE_SAME_SITE:Strict}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Base64-encoded 256-bit secret. CHANGE THIS IN PRODUCTION.
app.jwt.secret=bXlTdXBlclNlY3JldEtleUZvckFjY2V0UHJvamVjdEh1YjIwMjZTcHJpbmdCb290Sldt
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

# ---------- Seed demo data on first startup ----------
app.seed.enabled=true

# ---------- Error response detail ----------
server.error.include-message=never
server.error.include-binding-errors=always
